name: vsa

services:

  vsa-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: vsa-api:latest
    restart: unless-stopped
    env_file: .env.production
    environment:
      SITE_CONFIG_PATH: /app/config/site.yaml
    volumes:
      - lancedb_data:/data/lancedb
      - clips_data:/data/clips
      - ./config:/app/config          # writable: Config CRUD API writes here
    networks:
      - vsa-internal
    deploy:
      resources:
        limits:
          cpus: '${DOCKER_API_CPU_LIMIT:-1.0}'
          memory: '${DOCKER_API_MEM_LIMIT:-512M}'
        reservations:
          cpus: '${DOCKER_API_CPU_RES:-0.25}'
          memory: '${DOCKER_API_MEM_RES:-128M}'
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  vsa-engine:
    build:
      context: .
      dockerfile: docker/Dockerfile.engine
    image: vsa-engine:latest
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - lancedb_data:/data/lancedb
      - clips_data:/data/clips
      - ./config:/app/config          # read config; receive SIGHUP reloads
    networks:
      - vsa-internal
    deploy:
      resources:
        limits:
          cpus: '${DOCKER_ENGINE_CPU_LIMIT:-2.0}'
          memory: '${DOCKER_ENGINE_MEM_LIMIT:-2G}'
        reservations:
          cpus: '${DOCKER_ENGINE_CPU_RES:-0.5}'
          memory: '${DOCKER_ENGINE_MEM_RES:-512M}'
    depends_on:
      vsa-api:
        condition: service_healthy

  vsa-frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    image: vsa-frontend:latest
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - vsa-internal
    deploy:
      resources:
        limits:
          cpus: '${DOCKER_FRONTEND_CPU_LIMIT:-0.25}'
          memory: '${DOCKER_FRONTEND_MEM_LIMIT:-128M}'
        reservations:
          cpus: '${DOCKER_FRONTEND_CPU_RES:-0.05}'
          memory: '${DOCKER_FRONTEND_MEM_RES:-32M}'
    depends_on:
      - vsa-api

volumes:
  lancedb_data:
    driver: local
    driver_opts:
      type: none
      device: ${DATA_DIR:-./data}/lancedb    # bind-mount to host path for persistence
      o: bind
  clips_data:
    driver: local
    driver_opts:
      type: none
      device: ${DATA_DIR:-./data}/clips
      o: bind

networks:
  vsa-internal:
    driver: bridge
