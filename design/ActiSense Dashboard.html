<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ActiSense — Santa Lucia Hotel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,500,0,0&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#faf8f4;
  --bg-2:#f4f1ea;
  --surface:#ffffff;
  --ink:#1a1a17;
  --ink-2:#474339;
  --ink-3:#7b7668;
  --ink-4:#a8a294;
  --line:#ece7dc;
  --line-2:#e1dbcd;

  --accent:#3a8a7a;        /* sage/teal */
  --accent-soft:#e4f0ec;
  --accent-ink:#1f4a41;

  --sev-stat:#7b7668;      /* statistic */
  --sev-stat-bg:#efece3;
  --sev-notify:#b8731b;    /* notify */
  --sev-notify-bg:#fbf0db;
  --sev-alarm:#b0384c;     /* alarm */
  --sev-alarm-bg:#fbe4e7;

  --ok:#3a8a7a;
  --ok-bg:#e4f0ec;

  --radius:10px;
  --radius-lg:14px;
  --radius-sm:6px;

  --shadow-xs: 0 1px 0 rgba(20,18,10,.02);
  --shadow-sm: 0 1px 2px rgba(20,18,10,.04), 0 1px 0 rgba(255,255,255,.5) inset;
  --shadow-md: 0 6px 20px -8px rgba(20,18,10,.12), 0 2px 4px rgba(20,18,10,.04);
  --shadow-lg: 0 20px 60px -20px rgba(20,18,10,.25), 0 8px 24px -12px rgba(20,18,10,.12);
}

html.dark{
  --bg:#15140f;
  --bg-2:#1b1a14;
  --surface:#1f1e18;
  --ink:#f2efe6;
  --ink-2:#c8c3b3;
  --ink-3:#8f8a7b;
  --ink-4:#5c5849;
  --line:#2a2820;
  --line-2:#35322a;

  --accent:#6ab5a3;
  --accent-soft:#1e2f2b;
  --accent-ink:#a7d8cb;

  --sev-stat:#8f8a7b;
  --sev-stat-bg:#26241d;
  --sev-notify:#d89a4a;
  --sev-notify-bg:#33281a;
  --sev-alarm:#e07989;
  --sev-alarm-bg:#34202a;

  --ok:#6ab5a3;
  --ok-bg:#1e2f2b;

  --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
  --shadow-md: 0 6px 20px -8px rgba(0,0,0,.5);
  --shadow-lg: 0 20px 60px -20px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:'Geist',ui-sans-serif,system-ui,sans-serif;
  font-feature-settings:"cv11","ss01";
  -webkit-font-smoothing:antialiased;
  font-size:14px;line-height:1.45;
}
*::selection{background:var(--accent-soft);color:var(--accent-ink)}
button{font-family:inherit;color:inherit}

.mono{font-family:'Geist Mono',ui-monospace,monospace;font-feature-settings:"tnum"}

/* ---------- App shell ---------- */
.app{display:grid;grid-template-columns:264px 1fr;min-height:100vh;}
.sidebar{grid-column:1}
.main{grid-column:2}
@media (max-width: 900px){
  .sidebar,.main{grid-column:1}
}
.sidebar{
  border-right:1px solid var(--line);
  background:var(--bg-2);
  position:sticky;top:0;height:100vh;overflow-y:auto;
  display:flex;flex-direction:column;
}
.main{display:flex;flex-direction:column;min-width:0;min-height:100vh}

/* ---------- Sidebar ---------- */
.site-card{
  padding:18px 18px 14px;border-bottom:1px solid var(--line);
}
.site-brand{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.site-brand-logo{width:32px;height:32px;flex-shrink:0;color:var(--ink);display:block}
.site-brand-logo svg, .site-brand-logo img{width:100%;height:100%;display:block}
.site-brand-name{font-weight:600;font-size:14px;letter-spacing:-.01em}
.site-brand-tag{font-size:10.5px;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase;margin-top:1px}

.site-select{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 10px;background:var(--surface);
  border:1px solid var(--line-2);border-radius:var(--radius-sm);
  cursor:default;
}
.site-select-name{font-weight:500;font-size:13px}
.site-select-meta{font-size:11px;color:var(--ink-3);margin-top:1px}
.site-select-chev{color:var(--ink-4);font-size:11px}

.sidebar-section{padding:16px 18px 4px;}
.sidebar-label{
  font-size:10.5px;font-weight:600;color:var(--ink-3);
  letter-spacing:.08em;text-transform:uppercase;
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:8px;
}
.sidebar-label .count{
  font-weight:500;color:var(--ink-4);letter-spacing:.02em;text-transform:none;
}

.filter-list{display:flex;flex-direction:column;gap:1px}
.filter-item{
  display:flex;align-items:center;gap:10px;
  padding:7px 10px;border-radius:var(--radius-sm);
  cursor:default;font-size:13px;
  transition:background .12s ease;
}
.filter-item:hover{background:var(--bg)}
.filter-item.on{background:var(--surface);box-shadow:var(--shadow-xs)}
.filter-check{
  width:14px;height:14px;border-radius:4px;
  border:1.5px solid var(--line-2);
  flex-shrink:0;position:relative;
  background:var(--surface);
}
.filter-item.on .filter-check{
  background:var(--accent);border-color:var(--accent);
}
.filter-item.on .filter-check::after{
  content:"";position:absolute;left:3px;top:0px;width:4px;height:8px;
  border:solid #fff;border-width:0 1.5px 1.5px 0;transform:rotate(45deg);
}
.filter-label{flex:1;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filter-meta{font-size:11px;color:var(--ink-4);font-variant-numeric:tabular-nums}
.filter-item.on .filter-label{color:var(--ink);font-weight:500}

.pri-row{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:0 2px}
.pri-btn{
  padding:6px 0;border-radius:var(--radius-sm);
  border:1px solid var(--line-2);background:var(--surface);
  font-size:11.5px;font-weight:500;color:var(--ink-3);
  text-align:center;cursor:default;
  font-family:'Geist Mono',ui-monospace,monospace;
}
.pri-btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.pri-btn.p1.on{background:var(--sev-alarm);border-color:var(--sev-alarm)}
.pri-btn.p2.on{background:var(--sev-notify);border-color:var(--sev-notify)}

.action-chips{display:flex;gap:6px;flex-wrap:wrap}
.action-chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 9px;border-radius:999px;
  border:1px solid var(--line-2);background:var(--surface);
  font-size:11.5px;color:var(--ink-2);cursor:default;
}
.action-chip .dot{width:6px;height:6px;border-radius:50%;background:var(--ink-4)}
.action-chip.on{border-color:var(--ink-2);background:var(--bg-2)}
.action-chip[data-sev="statistic"] .dot{background:var(--sev-stat)}
.action-chip[data-sev="notify"] .dot{background:var(--sev-notify)}
.action-chip[data-sev="alarm"] .dot{background:var(--sev-alarm)}

.sidebar-foot{
  margin-top:auto;padding:14px 18px;border-top:1px solid var(--line);
  display:flex;align-items:center;gap:10px;
}
.avatar{
  width:26px;height:26px;border-radius:50%;
  background:linear-gradient(135deg,#c9b896,#9e8b6a);
  display:grid;place-items:center;color:#fff;font-size:11px;font-weight:600;
  flex-shrink:0;
}
.who{line-height:1.2}
.who-name{font-size:12.5px;font-weight:500}
.who-role{font-size:10.5px;color:var(--ink-3)}

/* ---------- Topbar ---------- */
.topbar{
  padding:18px 28px 0;
  border-bottom:1px solid var(--line);
  background:var(--bg);
}
.topbar-row{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:14px}
.topbar-title h1{
  margin:0;font-size:22px;font-weight:600;letter-spacing:-.015em;
}
.topbar-title .sub{font-size:12.5px;color:var(--ink-3);margin-top:3px}
.topbar-actions{display:flex;gap:8px;align-items:center}
.tb-btn{
  height:32px;padding:0 12px;border-radius:8px;
  border:1px solid var(--line-2);background:var(--surface);
  display:inline-flex;align-items:center;gap:7px;
  font-size:12.5px;font-weight:500;color:var(--ink-2);cursor:default;
}
.tb-btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tb-btn.primary:hover{background:#000}
.tb-btn .k{font-family:'Geist Mono',monospace;font-size:10.5px;
  padding:1px 5px;border-radius:4px;background:var(--bg-2);color:var(--ink-3);
  border:1px solid var(--line)}
.tb-btn.primary .k{background:rgba(255,255,255,.15);color:var(--bg);border-color:transparent}

/* ---------- Timebar ---------- */
.timebar{
  padding:8px 28px 20px;
  background:var(--bg);
  border-bottom:1px solid var(--line);
}
.timebar-head{
  display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;
}
.timebar-label{
  font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);
}
.timebar-range{
  font-family:'Geist Mono',monospace;font-size:13px;font-weight:500;color:var(--ink);
}
.timebar-range .sep{color:var(--ink-4);margin:0 8px}
.timebar-range .dur{color:var(--ink-3);margin-left:10px;font-size:11.5px}

.timebar-track-wrap{
  position:relative;height:68px;user-select:none;
}
.timebar-track{
  position:absolute;inset:14px 0 18px;
  background:var(--bg-2);
  border-radius:8px;
  overflow:hidden;
  border:1px solid var(--line);
}

/* Heat strip — event density across the day */
.timebar-heat{position:absolute;inset:0;display:flex}
.heat-cell{flex:1;position:relative}
.heat-bar{
  position:absolute;bottom:0;left:10%;right:10%;
  border-radius:2px 2px 0 0;
  background:var(--ink-4);opacity:.35;
}
.heat-bar.notify{background:var(--sev-notify);opacity:.9}
.heat-bar.alarm{background:var(--sev-alarm);opacity:1}

/* Range window overlay */
.timebar-dim-l,.timebar-dim-r{
  position:absolute;top:0;bottom:0;
  background:rgba(250,248,244,.72);
  backdrop-filter:saturate(.5);
  -webkit-backdrop-filter:saturate(.5);
  pointer-events:none;
}
html.dark .timebar-dim-l,html.dark .timebar-dim-r{background:rgba(21,20,15,.72)}
.timebar-window{
  position:absolute;top:-2px;bottom:-2px;
  border:1.5px solid var(--accent);
  background:transparent;
  border-radius:8px;
  box-shadow:0 0 0 4px rgba(58,138,122,.08),
             inset 0 0 0 1px rgba(255,255,255,.4);
  cursor:grab;
}
.timebar-window:active{cursor:grabbing}
.timebar-handle{
  position:absolute;top:50%;transform:translateY(-50%);
  width:4px;height:28px;background:var(--accent);
  border-radius:3px;cursor:ew-resize;
  box-shadow:0 0 0 4px rgba(58,138,122,.18);
}
.timebar-handle.l{left:-2px}
.timebar-handle.r{right:-2px}
.timebar-handle::before,.timebar-handle::after{
  content:"";position:absolute;left:50%;transform:translateX(-50%);
  width:1px;height:10px;background:#fff;opacity:.75;
}
.timebar-handle::before{top:5px}
.timebar-handle::after{bottom:5px}

/* Hour ticks */
.timebar-ticks{
  position:absolute;left:0;right:0;bottom:0;height:16px;
  display:flex;font-family:'Geist Mono',monospace;font-size:10px;color:var(--ink-4);
}
.tick{flex:1;position:relative;text-align:left}
.tick::before{content:"";position:absolute;top:-4px;left:0;width:1px;height:3px;background:var(--line-2)}
.tick span{position:absolute;top:2px;left:0;transform:translateX(-50%);white-space:nowrap}
.tick:first-child span{transform:translateX(0)}

/* Now marker */
.timebar-now{
  position:absolute;top:12px;bottom:16px;width:1px;background:var(--accent);
  pointer-events:none;
}
.timebar-now::before{
  content:"NOW";position:absolute;top:-14px;left:50%;transform:translateX(-50%);
  font-family:'Geist Mono',monospace;font-size:9px;font-weight:600;
  color:var(--accent);letter-spacing:.1em;
  background:var(--bg);padding:0 3px;
}

/* ---------- Content / grid ---------- */
.content{padding:22px 28px 40px;flex:1;min-width:0;min-height:0;background:var(--bg)}
.grid-head{
  display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;
}
.grid-head-title{font-size:13px;font-weight:600;color:var(--ink)}
.grid-head-title .meta{color:var(--ink-3);font-weight:400;margin-left:8px}
.grid-head-view{display:flex;gap:2px;background:var(--bg-2);padding:2px;border-radius:7px;border:1px solid var(--line)}
.view-btn{padding:4px 9px;border-radius:5px;font-size:11.5px;color:var(--ink-3);cursor:default}
.view-btn.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-xs);font-weight:500}

.area-grid{
  display:grid;gap:14px;
  grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
}

/* ---------- Area tile ---------- */
.tile{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  padding:0;
  box-shadow:var(--shadow-sm);
  cursor:default;
  transition:border-color .15s ease, transform .15s ease, box-shadow .15s ease;
  position:relative;overflow:hidden;
  display:flex;flex-direction:column;
}
.tile:hover{border-color:var(--line-2);transform:translateY(-1px);box-shadow:var(--shadow-md)}
.tile.sev-alarm{border-color:rgba(176,56,76,.35)}
.tile.sev-alarm::before{
  content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--sev-alarm);
}
.tile.sev-notify{border-color:rgba(184,115,27,.3)}
.tile.sev-notify::before{
  content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--sev-notify);
}

.tile-head{
  display:flex;align-items:flex-start;justify-content:space-between;
  padding:16px 16px 10px;gap:12px;
}
.tile-area{min-width:0}
.tile-area-name{font-size:15.5px;font-weight:600;letter-spacing:-.01em;margin:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile-area-meta{font-size:11.5px;color:var(--ink-3);margin-top:2px;display:flex;gap:10px;align-items:center}
.tile-area-meta .dot-sep{width:2px;height:2px;background:var(--ink-4);border-radius:50%}

.sev-badge{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 8px 3px 7px;border-radius:999px;font-size:11px;font-weight:600;
  font-family:'Geist',ui-sans-serif;letter-spacing:.01em;
  flex-shrink:0;
}
.sev-badge[data-sev="ok"]{background:var(--accent-soft);color:var(--accent-ink)}
.sev-badge[data-sev="statistic"]{background:var(--sev-stat-bg);color:var(--sev-stat)}
.sev-badge[data-sev="notify"]{background:var(--sev-notify-bg);color:var(--sev-notify)}
.sev-badge[data-sev="alarm"]{background:var(--sev-alarm-bg);color:var(--sev-alarm)}
.sev-badge .pulse{
  width:6px;height:6px;border-radius:50%;background:currentColor;position:relative;
}
.sev-badge[data-sev="alarm"] .pulse::after{
  content:"";position:absolute;inset:-4px;border-radius:50%;
  background:currentColor;opacity:.3;animation:pulse 1.6s ease-out infinite;
}
@keyframes pulse{0%{transform:scale(.6);opacity:.5}100%{transform:scale(1.8);opacity:0}}

/* Tile stats row */
.tile-stats{
  display:grid;grid-template-columns:repeat(3,1fr);
  border-top:1px solid var(--line);
  padding:10px 4px;
  background:linear-gradient(180deg,transparent,rgba(0,0,0,.012));
}
.stat{padding:0 12px;border-left:1px solid var(--line);min-width:0}
.stat:first-child{border-left:0}
.stat-v{font-family:'Geist Mono',monospace;font-size:18px;font-weight:500;letter-spacing:-.01em;color:var(--ink);
  font-variant-numeric:tabular-nums;line-height:1.1}
.stat-v.alarm{color:var(--sev-alarm)}
.stat-v.notify{color:var(--sev-notify)}
.stat-l{font-size:10.5px;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase;margin-top:3px}

/* Mini spark / timeline */
.tile-spark{
  height:26px;display:flex;gap:1px;padding:0 16px 10px;align-items:flex-end;
}
.spark-b{flex:1;background:var(--line-2);border-radius:1.5px 1.5px 0 0;min-height:2px;transition:background .2s}
.spark-b.in-range{background:var(--ink-3)}
.spark-b.notify{background:var(--sev-notify)}
.spark-b.alarm{background:var(--sev-alarm)}

/* Signals list */
.tile-signals{
  border-top:1px solid var(--line);
  padding:10px 16px 14px;
  flex:1;
  display:flex;flex-direction:column;gap:2px;
}
.tile-signals-hd{
  display:flex;justify-content:space-between;align-items:center;
  font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:6px;
}
.manage-btn{
  appearance:none;border:1px solid var(--line-2);background:var(--surface);
  width:24px;height:22px;border-radius:6px;
  display:inline-flex;align-items:center;justify-content:center;
  color:var(--ink-3);cursor:default;padding:0;
  transition:color .12s ease, border-color .12s ease, background .12s ease;
}
.manage-btn:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}

.sig-cog{
  appearance:none;border:1px solid transparent;background:transparent;
  width:24px;height:24px;border-radius:6px;padding:0;margin-left:2px;
  display:inline-flex;align-items:center;justify-content:center;
  color:var(--ink-4);cursor:default;
  transition:color .12s ease, border-color .12s ease, background .12s ease;
}
.sig-cog:hover{color:var(--accent);border-color:var(--line-2);background:var(--accent-soft)}
.sig-cog .mi{
  font-family:'Material Symbols Rounded';font-weight:500;font-style:normal;
  font-size:17px;line-height:1;letter-spacing:normal;
  font-feature-settings:'liga';-webkit-font-smoothing:antialiased;
}

.sig{
  display:flex;align-items:center;gap:10px;
  padding:6px 0;font-size:12.5px;min-width:0;
}
.sig + .sig{border-top:1px dashed var(--line)}
.sig-state{
  width:8px;height:8px;border-radius:50%;flex-shrink:0;
  background:var(--line-2);box-shadow:0 0 0 2px var(--bg-2);
}
.sig-state.active.statistic{background:var(--sev-stat)}
.sig-state.active.notify{background:var(--sev-notify)}
.sig-state.active.alarm{background:var(--sev-alarm)}
.sig-state.active{box-shadow:0 0 0 2px currentColor-bg;}
.sig-state.off{opacity:.3}

.sig-text{flex:1;color:var(--ink-2);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sig.disabled .sig-text{color:var(--ink-4);text-decoration:line-through;text-decoration-color:var(--ink-4)}
.sig-meta{
  font-family:'Geist Mono',monospace;font-size:11px;color:var(--ink-4);
  display:flex;align-items:center;gap:6px;flex-shrink:0;
}
.sig-meta .thr{padding:1px 5px;background:var(--bg-2);border-radius:4px;border:1px solid var(--line);color:var(--ink-3)}
.sig-meta .count{min-width:20px;text-align:right}
.sig-meta .count.hi{color:var(--sev-alarm);font-weight:500}

.sig-toggle{
  width:26px;height:14px;border-radius:999px;background:var(--line-2);
  position:relative;cursor:default;transition:background .15s;
}
.sig-toggle::after{
  content:"";position:absolute;top:1px;left:1px;width:12px;height:12px;
  background:#fff;border-radius:50%;transition:transform .15s;
  box-shadow:0 1px 2px rgba(0,0,0,.2);
}
.sig-toggle.on{background:var(--accent)}
.sig-toggle.on::after{transform:translateX(12px)}

/* ---------- Threshold popover ---------- */
.popover-backdrop{position:fixed;inset:0;z-index:80;background:rgba(20,18,10,.15);backdrop-filter:blur(2px)}
.popover{
  position:fixed;z-index:90;
  background:var(--surface);border:1px solid var(--line-2);
  border-radius:12px;box-shadow:var(--shadow-lg);
  width:320px;padding:16px;
}
.pop-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.pop-title{font-size:12px;font-weight:600;color:var(--ink)}
.pop-close{font-size:16px;color:var(--ink-4);cursor:default;line-height:1}
.pop-sig{font-size:13.5px;font-weight:500;color:var(--ink);margin-bottom:4px}
.pop-meta{font-size:11.5px;color:var(--ink-3);margin-bottom:14px;display:flex;gap:8px;align-items:center}
.pop-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.pop-row-label{font-size:12px;font-weight:500;color:var(--ink-2)}
.pop-row-sub{font-size:11px;color:var(--ink-4);margin-top:1px}
.pop-slider{width:100%;-webkit-appearance:none;appearance:none;height:4px;background:var(--line-2);border-radius:999px;outline:none;margin-top:10px}
.pop-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent);cursor:default;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.pop-slider::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.pop-thr-row{display:flex;justify-content:space-between;margin-top:6px;font-family:'Geist Mono',monospace;font-size:10.5px;color:var(--ink-4)}
.pop-select{width:100%;margin-top:8px;height:30px;padding:0 8px;border-radius:6px;background:var(--surface);border:1px solid var(--line-2);color:var(--ink);font-family:inherit;font-size:12.5px}

/* ---------- Event detail drawer ---------- */
.drawer-backdrop{position:fixed;inset:0;background:rgba(20,18,10,.2);backdrop-filter:blur(2px);z-index:60;animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.drawer{
  position:fixed;right:0;top:0;bottom:0;z-index:70;
  width:460px;max-width:100vw;
  background:var(--bg);border-left:1px solid var(--line);
  box-shadow:var(--shadow-lg);
  display:flex;flex-direction:column;
  animation:slideIn .22s cubic-bezier(.2,.8,.2,1);
}
@keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}
.drw-head{padding:18px 20px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.drw-title h3{margin:0;font-size:16px;font-weight:600;letter-spacing:-.01em}
.drw-title .crumb{font-size:11.5px;color:var(--ink-3);margin-top:3px}
.drw-close{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--ink-3);cursor:default;font-size:16px;line-height:1;border:1px solid var(--line);background:var(--surface)}
.drw-close:hover{background:var(--bg-2)}

.drw-body{flex:1;overflow-y:auto;padding:18px 20px 24px;display:flex;flex-direction:column;gap:18px}
.drw-section{}
.drw-section-hd{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}

/* Frame viewer */
.frame{
  aspect-ratio:16/10;background:#0f1010;border-radius:10px;position:relative;overflow:hidden;border:1px solid var(--line);
  background-image:
    linear-gradient(130deg,#2a2e3a 0%,#1a1d27 40%,#14161d 100%),
    repeating-linear-gradient(45deg,rgba(255,255,255,.02) 0 2px,transparent 2px 8px);
  background-blend-mode:overlay;
}
.frame::before{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(circle at 30% 60%,rgba(255,220,180,.12) 0 8%,transparent 14%),
    radial-gradient(circle at 72% 55%,rgba(180,200,255,.1) 0 6%,transparent 12%),
    radial-gradient(circle at 50% 90%,rgba(0,0,0,.4) 0 20%,transparent 45%);
}
.frame-bbox{
  position:absolute;border:1.5px solid var(--sev-notify);border-radius:3px;
  box-shadow:0 0 0 2000px rgba(0,0,0,.25);
}
.frame-bbox::after{
  content:attr(data-label);position:absolute;top:-20px;left:-1px;
  font-family:'Geist Mono',monospace;font-size:10px;font-weight:600;
  background:var(--sev-notify);color:#fff;padding:2px 6px;border-radius:3px 3px 3px 0;
  white-space:nowrap;
}
.frame-meta{
  position:absolute;top:10px;left:10px;right:10px;
  display:flex;justify-content:space-between;font-family:'Geist Mono',monospace;
  font-size:10.5px;color:#e8e5db;text-shadow:0 1px 4px rgba(0,0,0,.8);
}
.frame-meta .rec{display:inline-flex;align-items:center;gap:6px}
.frame-meta .rec::before{content:"";width:7px;height:7px;border-radius:50%;background:#e04b5a;box-shadow:0 0 8px #e04b5a}

/* Pipeline */
.pipeline{
  display:flex;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;
}
.pipe-step{flex:1;padding:12px 14px;border-left:1px solid var(--line);min-width:0}
.pipe-step:first-child{border-left:0}
.pipe-step .lbl{font-size:10px;font-weight:600;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.pipe-step .val{font-family:'Geist Mono',monospace;font-size:15px;font-weight:500;color:var(--ink);line-height:1.1}
.pipe-step .sub{font-size:11px;color:var(--ink-3);margin-top:3px}
.pipe-step .score-bar{height:3px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
.pipe-step .score-bar .fill{height:100%;background:var(--accent);border-radius:2px}
.pipe-step .score-bar .fill.over{background:var(--sev-notify)}
.pipe-step .score-bar .fill.over.alarm{background:var(--sev-alarm)}

/* LLM response */
.llm-card{
  background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;
}
.llm-card-hd{
  padding:10px 14px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;background:var(--bg-2);
}
.llm-card-hd .who{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:500}
.llm-avatar{
  width:20px;height:20px;border-radius:5px;
  background:conic-gradient(from 0deg,#c9a86a,#9b7aa3,#5e8b9e,#c9a86a);
  position:relative;
}
.llm-avatar::after{content:"";position:absolute;inset:4px;background:var(--surface);border-radius:2px}
.llm-card-meta{font-family:'Geist Mono',monospace;font-size:10.5px;color:var(--ink-3)}
.llm-card-body{padding:14px}
.llm-card-body p{margin:0 0 8px;font-size:13px;line-height:1.55;color:var(--ink-2)}
.llm-card-body p:last-child{margin-bottom:0}
.llm-card-body strong{color:var(--ink);font-weight:600}

.timeline-list{display:flex;flex-direction:column;gap:0}
.tl-item{
  display:grid;grid-template-columns:56px 1fr;gap:12px;padding:10px 0;
  border-top:1px solid var(--line);
}
.tl-item:first-child{border-top:0}
.tl-time{font-family:'Geist Mono',monospace;font-size:12px;color:var(--ink-3)}
.tl-content{min-width:0}
.tl-content .tl-sig{font-size:12.5px;font-weight:500;color:var(--ink);margin-bottom:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-content .tl-sub{font-size:11.5px;color:var(--ink-3);display:flex;gap:8px;align-items:center}
.tl-pill{font-size:10px;padding:1px 6px;border-radius:999px;font-weight:600;letter-spacing:.02em}
.tl-pill[data-sev="statistic"]{background:var(--sev-stat-bg);color:var(--sev-stat)}
.tl-pill[data-sev="notify"]{background:var(--sev-notify-bg);color:var(--sev-notify)}
.tl-pill[data-sev="alarm"]{background:var(--sev-alarm-bg);color:var(--sev-alarm)}

/* ---------- Responsive ---------- */
@media (max-width: 1100px){
  .app{grid-template-columns:220px 1fr}
  .drawer{width:400px}
}
@media (max-width: 900px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:280px;z-index:50;transform:translateX(-100%);transition:transform .22s ease}
  .sidebar.open{transform:translateX(0)}
  .sidebar-scrim{position:fixed;inset:0;background:rgba(20,18,10,.3);z-index:45;display:none}
  .sidebar-scrim.on{display:block}
  .menu-btn{display:inline-flex !important}
}
@media (max-width: 700px){
  .topbar{padding:14px 16px 0}
  .timebar{padding:6px 16px 16px}
  .content{padding:16px 16px 32px}
  .topbar-row{flex-direction:column;align-items:stretch;gap:12px}
  .topbar-actions{flex-wrap:wrap}
  .tb-btn .k{display:none}
  .drawer{width:100vw;max-width:100vw}
  .topbar-title h1{font-size:19px}
  .area-grid{grid-template-columns:1fr;gap:12px}
}
.menu-btn{display:none;height:32px;width:32px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);align-items:center;justify-content:center;cursor:default}
.menu-btn svg{width:16px;height:16px}

/* ---------- Scrollbar ---------- */
.sidebar::-webkit-scrollbar,.drw-body::-webkit-scrollbar{width:8px}
.sidebar::-webkit-scrollbar-thumb,.drw-body::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:4px}
.sidebar::-webkit-scrollbar-track,.drw-body::-webkit-scrollbar-track{background:transparent}

/* ---------- Tooltip ---------- */
.tip{position:relative}
.tip[data-tip]:hover::after{
  content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);
  background:var(--ink);color:var(--bg);font-size:10.5px;padding:3px 7px;border-radius:5px;white-space:nowrap;
  font-family:'Geist',sans-serif;z-index:100;
}

/* dot separator used in small metadata lines */
.dot-sep{width:2px;height:2px;background:var(--ink-4);border-radius:50%}
</style>
</head>
