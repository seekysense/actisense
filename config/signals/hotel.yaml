signals:
  # Safety signals
  - id: person_on_ground
    name: "Man Down"
    text: "overhead camera: person lying completely flat on the floor, full body length visible from head to feet, legs fully extended straight, body spread across a large floor area, collapsed and fallen"
    priority: 1
    default_threshold: 0.44
    default_action: alarm
    escalation_llm: true
    llm_prompt_key: person_down
    temporal_context_sec: 3
    zone:
      - tables
      - concierge_desk
      - sofa_1
      - bench

  - id: smoking
    name: "Smoking Detected"
    text: "a person holding a cigarette between their fingers, hand raised near their face, thin smoke trail visible"
    priority: 2
    default_threshold: 0.60
    default_action: notify
    escalation_llm: true
    llm_prompt_key: smoking_context
    temporal_context_sec: 2
    zone:
      - tables
      - counter
      - sofa_1
      - sofa_2
      - armchair
      - concierge_desk
      - bench

  - id: fire_smoke
    name: "Fire/Smoke Detected"
    text: "visible flames or thick dark smoke in the room, fire burning or smoke cloud rising"
    priority: 1
    default_threshold: 0.42
    default_action: alarm
    escalation_llm: true
    llm_prompt_key: fire_smoke_context
    zone:
      - coffee_machine
      - counter
      - cabinet
      - tables
      - sofa_1
      - sofa_2
      - armchair
      - concierge_desk

  - id: unattended_luggage
    name: "Unattended Luggage"
    text: "a bag or suitcase left alone on the floor, no person standing next to it"
    priority: 2
    default_threshold: 0.43
    default_action: notify
    escalation_llm: true
    llm_prompt_key: unattended_bag
    temporal_context_sec: 5
    zone:
      - tables
      - sofa_1
      - sofa_2
      - armchair
      - bench
      - door

  - id: person_count_stat
    name: "Person Count"
    text: "people present in the area, standing or moving"
    priority: 5
    default_threshold: 0.43
    default_action: statistic
    escalation_llm: false
    source: native_axis
    zone:
      - tables
      - bench

  - id: unauthorized_area
    name: "Unauthorized Area"
    text: "a person standing at or opening a locked storage unit, accessing items inside"
    priority: 2
    default_threshold: 0.43
    default_action: notify
    escalation_llm: true
    zone: cabinet

  # Activity signals
  - id: dog_presence
    name: "Dog Detected"
    text: "a dog or puppy visible in the area, walking on the floor, sitting, or held by a person, fur and four legs clearly identifiable as a canine"
    priority: 2
    default_threshold: 0.38
    default_action: notify
    escalation_llm: true
    llm_prompt_key: dog_presence
    zone:
      - tables
      - sofa_1
      - sofa_2
      - armchair
      - concierge_desk
      - bench
      - door

  - id: working_with_pc
    name: "Working with PC"
    text: "a person seated on a sofa or at a table in a hotel lounge, working on an open laptop computer with hands on the keyboard, bags or backpack visible nearby, looking at the screen or typing"
    priority: 5
    default_threshold: 0.55
    default_action: statistic
    escalation_llm: false
    zone:
      - tables
      - counter
      - sofa_1
      - sofa_2
      - armchair
      - concierge_desk
      - bench

  - id: cleaning_setup
    name: "Cleaning Setup"
    text: "hotel cleaning staff holding a long-handled mop or broom sweeping the floor, or crouching to wipe glass surfaces and furniture with a cloth, cleaning equipment visible in the area"
    priority: 3
    default_threshold: 0.45
    default_action: statistic
    escalation_llm: true
    zone:
      - tables
      - counter
      - sofa_1
      - sofa_2
      - concierge_desk

  - id: eating_drinking
    name: "Eating/Drinking"
    text: "a person seated at a table eating food from a plate or drinking from a glass or cup"
    priority: 3
    default_threshold: 0.55
    default_action: statistic
    escalation_llm: true
    zone:
      - tables
      - counter
      - sofa_1
      - sofa_2
      - armchair
      - concierge_desk
      - bench

  # Entrance
  - id: checkin_desk
    name: "Check-in at Desk"
    text: "a person leaning forward with torso bent over a hotel reception counter, both hands resting on the desk surface, upper body inclined close to the front desk"
    priority: 3
    default_threshold: 0.43
    default_action: notify
    escalation_llm: true
    llm_prompt_key: checkin_desk_context
    zone: concierge_desk

  - id: tailgating
    name: "Tailgating"
    text: "two people passing through a doorway in immediate close succession, one following directly behind the other without a gap"
    priority: 2
    default_threshold: 0.43
    default_action: notify
    escalation_llm: true
    llm_prompt_key: tailgating_context
    temporal_context_sec: 3
    zone: door

  - id: door_forced
    name: "Forced Entry Attempt"
    text: "a person pushing or pulling hard on a door that does not open, repeatedly attempting to force entry, body leaning against the door frame"
    priority: 1
    default_threshold: 0.42
    default_action: alarm
    escalation_llm: true
    llm_prompt_key: door_forced_context
    zone: door

  - id: person_at_door
    name: "Person at Door"
    text: "a person standing at or passing through a doorway, body framed in the entrance threshold"
    priority: 5
    default_threshold: 0.43
    default_action: statistic
    escalation_llm: false
    zone: door

  - id: luggage_arrival
    name: "Luggage Arrival"
    text: "a person carrying a travel bag or wheeling a suitcase, luggage clearly visible alongside their body"
    priority: 4
    default_threshold: 0.43
    default_action: statistic
    escalation_llm: false
    zone:
      - door
      - bench
      - concierge_desk

  - id: concierge_interaction
    name: "Concierge Interaction"
    text: "a person standing or leaning at a reception engaged in a face-to-face interaction"
    priority: 4
    default_threshold: 0.43
    default_action: statistic
    escalation_llm: false
    zone: concierge_desk

  - id: person_waiting_bench
    name: "Person Waiting at Bench"
    text: "a person seated on a bench or waiting chair, remaining still for an extended time"
    priority: 5
    default_threshold: 0.43
    default_action: statistic
    escalation_llm: false
    zone: 
      - bench
      - sofa_1
      - sofa_2
      - armchair

  - id: door_open
    name: "Door Open"
    text: "an entrance door swung fully open with the door panel displaced to the side, the open passageway clearly visible and unobstructed, natural exterior light streaming through the open doorway"
    priority: 5
    default_threshold: 0.38
    default_action: statistic
    escalation_llm: false
    zone: door

  # Hallway Lockers
  - id: locker_interaction
    name: "Locker Interaction"
    text: "a person leaning forward or crouching beside a wooden locker cabinet in a hotel corridor, reaching a hand toward an electronic keypad or card reader mounted on the locker panel, holding or tapping a key fob, NFC token or access card to unlock a storage compartment, body oriented close to the locker surface with head bowed, viewed from an overhead ceiling camera looking down"
    priority: 3
    default_threshold: 0.30
    default_action: notify
    escalation_llm: true
    llm_prompt_key: locker_interaction_context
    temporal_context_sec: 4
    zone: lockers

  # Parking Lot
  - id: vehicle_transit
    name: "Vehicle Transit"
    text: "a car, van, motorcycle or other vehicle moving through or parked in the parking area, vehicle body, wheels and headlights clearly visible, the vehicle occupying the roadway or a parking bay"
    priority: 4
    default_threshold: 0.35
    default_action: statistic
    escalation_llm: false
    zone: parking

  - id: vehicle_loading_unloading
    name: "Vehicle Loading/Unloading"
    text: "a person carrying, lifting or dragging objects, bags, boxes or luggage between a vehicle and the ground, trunk or rear door of the vehicle open, items being transferred to or from the car boot or cargo area"
    priority: 3
    default_threshold: 0.35
    default_action: notify
    escalation_llm: true
    llm_prompt_key: vehicle_loading_context
    temporal_context_sec: 4
    zone: parking

  # Bike Storage
  - id: bike_transit
    name: "Bike Transit"
    text: "a bicycle being walked or ridden through the area, two large circular wheels clearly visible, handlebars and frame identifiable, the bike occupying floor space as a distinct two-wheeled vehicle separate from any person"
    priority: 4
    default_threshold: 0.42
    default_action: statistic
    escalation_llm: false
    zone: bikestorage

  - id: garage_door_open
    name: "Garage Door Open"
    text: "a large hinged glass-panel door or gate swung open to the side, the door panel displaced away from its frame revealing a visible gap or open passageway, frosted or translucent glass panels with metal grid frame, entrance accessible"
    priority: 3
    default_threshold: 0.35
    default_action: notify
    escalation_llm: true
    llm_prompt_key: garage_door_context
    temporal_context_sec: 3
    zone: bikestorage

  # Cabinet
  - id: cabinet_opened
    name: "Cabinet Interaction"
    text: "a person standing in front of an open tall glass-panel cabinet with dark metal frame, cabinet glass doors open exposing illuminated wooden shelves stocked with food products, snack boxes, bottles and drinks, person oriented toward the open cabinet with arm raised or hand near the door frame or interior shelves, hotel honesty bar or pantry minibar"
    priority: 3
    default_threshold: 0.40
    default_action: statistic
    escalation_llm: true
    llm_prompt_key: cabinet_interaction_context
    temporal_context_sec: 10
    zone: cabinet

  - id: cabinet_item_taken
    name: "Cabinet Item Taken"
    text: "a person standing at an open tall glass display cabinet with dark metal frame, arm extended inside or reaching across the open cabinet door toward shelves stocked with bottles, snack boxes and food packages, hand gripping or retrieving an item from the hotel honesty bar minibar, upper display shelves or lower refrigerator compartment open, person upright or slightly bent at waist"
    priority: 2
    default_threshold: 0.35
    default_action: notify
    escalation_llm: true
    llm_prompt_key: cabinet_item_taken_context
    temporal_context_sec: 10
    zone: cabinet
